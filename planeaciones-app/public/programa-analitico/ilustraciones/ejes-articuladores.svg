<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Ejes articuladores</title>
  <desc id="desc">Los siete ejes articuladores del Plan de Estudios.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/></filter></defs>
  <rect width="900" height="720" rx="36" fill="#f8fafc"/>
  <text x="450" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="850" fill="#0f172a">Ejes articuladores</text>
  <g font-family="system-ui, sans-serif" font-size="23" font-weight="800" text-anchor="middle" filter="url(#shadow)">
    <rect x="120" y="115" width="660" height="62" rx="18" fill="#ef4444"/><text x="450" y="154" fill="white">Inclusión</text>
    <rect x="120" y="194" width="660" height="62" rx="18" fill="#fbbf24"/><text x="450" y="233" fill="#422006">Pensamiento crítico</text>
    <rect x="120" y="273" width="660" height="62" rx="18" fill="#fde047"/><text x="450" y="312" fill="#422006">Interculturalidad crítica</text>
    <rect x="120" y="352" width="660" height="62" rx="18" fill="#84cc16"/><text x="450" y="391" fill="#1a2e05">Igualdad de género</text>
    <rect x="120" y="431" width="660" height="76" rx="18" fill="#0ea5e9"/><text x="450" y="462" fill="#082f49">Apropiación de las culturas a través</text><text x="450" y="491" fill="#082f49">de la lectura y la escritura</text>
    <rect x="120" y="524" width="660" height="62" rx="18" fill="#7c3aed"/><text x="450" y="563" fill="white">Artes y experiencias estéticas</text>
    <rect x="120" y="603" width="660" height="62" rx="18" fill="#db2777"/><text x="450" y="642" fill="white">Vida saludable</text>
  </g>
</svg>

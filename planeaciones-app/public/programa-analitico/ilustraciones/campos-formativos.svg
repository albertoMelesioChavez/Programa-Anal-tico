<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Campos formativos</title>
  <desc id="desc">Relación entre los cuatro campos formativos, los contenidos y los procesos de desarrollo de aprendizaje.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="600" rx="36" fill="#f8fafc"/>
  <text x="450" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Campos formativos</text>
  <g filter="url(#shadow)" font-family="system-ui, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="white">
    <rect x="95" y="120" width="330" height="76" rx="18" fill="#ef4444"/><text x="260" y="167">Lenguajes</text>
    <rect x="475" y="120" width="330" height="76" rx="18" fill="#0284c7"/><text x="640" y="151">Saberes y pensamiento</text><text x="640" y="179">científico</text>
    <rect x="95" y="230" width="330" height="76" rx="18" fill="#16a34a"/><text x="260" y="261">Ética, naturaleza y</text><text x="260" y="289">sociedades</text>
    <rect x="475" y="230" width="330" height="76" rx="18" fill="#7c3aed"/><text x="640" y="261">De lo humano y lo</text><text x="640" y="289">comunitario</text>
  </g>
  <path d="M260 320 V365 H450" fill="none" stroke="#64748b" stroke-width="5"/><path d="M640 320 V365 H450" fill="none" stroke="#64748b" stroke-width="5"/>
  <path d="M450 365 V410" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="280" y="420" width="340" height="64" rx="16" fill="#f59e0b" filter="url(#shadow)"/><text x="450" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#422006">Contenidos</text>
  <path d="M450 485 V515" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="210" y="525" width="480" height="58" rx="16" fill="#fb923c"/><text x="450" y="561" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#431407">Procesos de desarrollo de aprendizaje</text>
</svg>
